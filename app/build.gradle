plugins { id 'com.android.application' }

android {
    namespace 'io.github.hakami55.x2patcher'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.hakami55.x2patcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('PATCHER_KEYSTORE')) {
                storeFile file(System.getenv('PATCHER_KEYSTORE'))
                storePassword System.getenv('PATCHER_STORE_PASSWORD')
                keyAlias 'patcher'
                keyPassword System.getenv('PATCHER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = false }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
